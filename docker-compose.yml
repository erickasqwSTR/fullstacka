version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fullstacktest_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: pedidosp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: fullstacktest_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_CLIENT: mysql2
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: pedidosp
    depends_on:
      - mysql
    volumes:
      - .:/usr/src/app
    command: ["npm", "start"]

volumes:
  mysql_data:
